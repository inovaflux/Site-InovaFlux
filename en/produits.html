<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>InovaFlux Catalog | Options & Kits</title>
    <style>
        :root {
            --bleu: #1A365D;
            --orange: #E67E22;
            --fond: #F4F7F6;
            --gris-clair: #e2e8f0;
        }

        body { font-family: 'Segoe UI', Tahoma, sans-serif; margin: 0; background: var(--fond); color: #333; line-height: 1.5; }
        
        header {
            background: white;
            padding: 16px 5%;
            border-bottom: 2px solid var(--bleu);
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: sticky;
            top: 0;
            z-index: 1000;
            gap: 20px;
            flex-wrap: wrap;
        }

        .logo { height: 120px; width: auto; display: block; max-width: 100%; }

        .nav-top { display: flex; gap: 15px; flex-wrap: wrap; align-items: center; }

        .lang-switch {
            margin-left: 10px;
            font-size: 0.9rem;
        }

        .lang-switch a {
            color: var(--bleu);
            text-decoration: none;
        }

        .lang-switch a:hover {
            text-decoration: underline;
        }

        .btn-nav {
            display: inline-block;
            text-decoration: none;
            font-weight: bold;
            padding: 12px 22px;
            border-radius: 8px;
            transition: 0.3s;
        }

        .btn-bleu {
            color: var(--bleu);
            border: 2px solid var(--bleu);
        }

        .btn-bleu:hover,
        .btn-nav.current.btn-bleu {
            background: var(--bleu);
            color: white;
        }

        .btn-orange {
            background: var(--orange);
            color: white;
            border: 2px solid var(--orange);
        }

        .btn-orange:hover,
        .btn-nav.current.btn-orange {
            background: #d35400;
            border-color: #d35400;
        }

        .container { padding: 40px 5%; max-width: 1200px; margin: 0 auto; }
        .intro-text { text-align: center; margin-bottom: 40px; color: #555; }

        .produit-card {
            background: white; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            margin-bottom: 50px; overflow: hidden; display: flex; flex-direction: column;
        }

        .produit-header { display: flex; gap: 30px; padding: 30px; background: white; flex-wrap: wrap; }

        .produit-image { 
            flex: 1; min-width: 250px; background: #eee; border-radius: 8px; 
            border: 1px solid #ddd;
        }
        
        .produit-image img {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            object-fit: contain;
            display: block;
        }

        .carousel {
            position: relative;
            overflow: hidden;
        }

        .carousel-inner {
            position: relative;
            width: 100%;
            aspect-ratio: 16 / 9;   /* fixed frame: content below the image no longer shifts */
        }

        .carousel-item {
            display: none;
        }

        .carousel-item.active {
            display: block;
        }

        .carousel-btn {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            background: rgba(0,0,0,0.4);
            color: #fff;
            border: none;
            border-radius: 50%;
            width: 32px;
            height: 32px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
        }

        .carousel-btn.prev { left: 8px; }
        .carousel-btn.next { right: 8px; }

        .carousel-inner { cursor: zoom-in; }

        /* --- LIGHTBOX (enlarged photos) --- */
        .lightbox {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.9);
            z-index: 10000;
            align-items: center;
            justify-content: center;
        }
        .lightbox.open { display: flex; }
        .lightbox-img {
            max-width: 92vw;
            max-height: 86vh;
            object-fit: contain;
            border-radius: 6px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.6);
        }
        .lightbox-close {
            position: absolute;
            top: 16px;
            right: 24px;
            background: rgba(255, 255, 255, 0.15);
            color: #fff;
            border: none;
            width: 44px;
            height: 44px;
            border-radius: 50%;
            font-size: 1.6rem;
            line-height: 1;
            cursor: pointer;
        }
        .lightbox-nav {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            background: rgba(255, 255, 255, 0.15);
            color: #fff;
            border: none;
            width: 48px;
            height: 48px;
            border-radius: 50%;
            font-size: 1.5rem;
            cursor: pointer;
        }
        .lightbox-nav.prev { left: 20px; }
        .lightbox-nav.next { right: 20px; }
        .lightbox-close:hover, .lightbox-nav:hover { background: rgba(255, 255, 255, 0.32); }
        .lightbox-counter {
            position: absolute;
            bottom: 18px;
            left: 50%;
            transform: translateX(-50%);
            color: #fff;
            font-size: 0.9rem;
            background: rgba(0, 0, 0, 0.4);
            padding: 4px 12px;
            border-radius: 12px;
        }

        .produit-intro { flex: 2; min-width: 300px; }
        .ref { font-family: monospace; color: #718096; font-weight: bold; }
        h2 { color: var(--bleu); margin-top: 5px; }

        .options-table { width: 100%; border-collapse: collapse; background: #fff; }
        .options-table th { background: var(--bleu); color: white; padding: 12px; text-align: left; }
        .options-table td { padding: 15px; border-top: 1px solid var(--gris-clair); vertical-align: middle; }

        .price-tag { font-weight: bold; color: var(--bleu); font-size: 1.1rem; }

        .btn-Commande {
            display: inline-block; padding: 8px 16px; border-radius: 4px;
            text-decoration: none; font-weight: bold; font-size: 0.9rem;
            transition: 0.2s; text-align: center; background: var(--orange); color: white;
        }
        .btn-Commande:hover { background: #d35400; }

        @media (max-width: 900px) {
            header {
                padding: 10px 3%;
            }

            .logo {
                height: 80px;
            }

            .produit-header {
                flex-direction: column;
            }
        }

        @media (max-height: 500px) and (orientation: landscape) {
            header {
                padding: 5px 3%;
            }

            .logo {
                height: 40px;
            }

            .nav-top {
                gap: 8px;
            }

            .btn-nav {
                padding: 6px 12px;
                font-size: 0.85rem;
            }
        }

        @media (max-width: 600px) {
            .container {
                padding: 20px 4%;
            }

            .options-table {
                width: 100%;
                table-layout: fixed;
                font-size: 0.85rem;
            }

            .options-table th,
            .options-table td {
                padding: 8px 6px;
                word-wrap: break-word;
            }

            .btn-Commande {
                display: inline-block;
                padding: 6px 8px;
                font-size: 0.75rem;
                white-space: normal;
                max-width: 90%;
            }
        }

        .btn-3d {
            display: inline-flex; align-items: center; gap: 6px;
            margin-top: 12px; padding: 8px 18px;
            background: var(--bleu); color: white;
            border: none; border-radius: 6px;
            font-size: 0.9rem; font-weight: bold;
            cursor: pointer; transition: background 0.2s;
        }
        .btn-3d:hover { background: #0f2440; }

        .modal-3d { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.75); z-index: 9999; align-items: center; justify-content: center; }
        .modal-3d.open { display: flex; }
        .modal-3d-inner { background: #1a1a2e; border-radius: 12px; width: 90vw; max-width: 900px; height: 80vh; display: flex; flex-direction: column; overflow: hidden; box-shadow: 0 20px 60px rgba(0,0,0,0.6); }
        .modal-3d-header { display: flex; align-items: center; justify-content: space-between; padding: 14px 20px; background: var(--bleu); color: white; font-weight: bold; }
        .modal-3d-close { background: none; border: none; color: white; font-size: 1.4rem; cursor: pointer; line-height: 1; }
        #viewer-container { flex: 1; width: 100%; }
        #viewer-container iframe { width: 100%; height: 100%; border: none; }
        .viewer-msg { display: flex; align-items: center; justify-content: center; height: 100%; color: #aaa; font-size: 1rem; text-align: center; padding: 30px; line-height: 1.8; }
    </style>
    <script src="../libs/o3dv.min.js"></script>
    <link rel="stylesheet" href="../theme.css">
    <script src="../theme.js"></script>
</head>
<body>

<div class="modal-3d" id="modal3d">
    <div class="modal-3d-inner">
        <div class="modal-3d-header">
            <span id="modal3d-title">3D View</span>
            <button class="modal-3d-close" id="modal3d-close" title="Close">?</button>
        </div>
        <div id="viewer-container"></div>
    </div>
</div>

<!-- Lightbox: enlarged photos -->
<div class="lightbox" id="lightbox" aria-hidden="true">
    <button class="lightbox-close" id="lb-close" title="Close">&times;</button>
    <button class="lightbox-nav prev" id="lb-prev" title="Previous">&#10094;</button>
    <img class="lightbox-img" id="lb-img" src="" alt="">
    <button class="lightbox-nav next" id="lb-next" title="Next">&#10095;</button>
    <span class="lightbox-counter" id="lb-counter"></span>
</div>

<header>
    <a href="index.html">
        <img src="../logo.png" alt="InovaFlux" class="logo">
    </a>

    <nav class="nav-top">
        <a href="index.html" class="btn-nav btn-bleu">? Home</a>
        <a href="produits.html" class="btn-nav btn-bleu current">Products</a>
        <a href="telechargements.html" class="btn-nav btn-bleu">Downloads</a>
        <a href="contact.html" class="btn-nav btn-orange">Contact</a>
        <a href="panier.html" class="btn-nav btn-bleu">Cart</a>
        <span class="lang-switch">EN | <a href="../produits.html">FR</a></span>
    </nav>
</header>

<div class="container">
    <div class="intro-text">
        <h1>Automation Solutions</h1>
        <p>Select your product and preferred version. For school orders, use the <strong>Contact</strong> button at the top of the page.</p>
    </div>

    <div id="produits-container"></div>
</div>

<script>
    // Generate products dynamically from produits.json (English fields)
    fetch('../produits.json?v=' + Date.now())
        .then(function (res) { return res.json(); })
        .then(function (data) {
            var container = document.getElementById('produits-container');
            if (!container || !data || !Array.isArray(data.products)) return;

            data.products.forEach(function (p) {
                var images = Array.isArray(p.images) && p.images.length ? p.images : (p.image ? [p.image] : []);

                var card = document.createElement('div');
                card.className = 'produit-card';

                card.innerHTML =
                    '<div class="produit-header">' +
                        '<div class="produit-image carousel" data-product-id="' + p.id + '">' +
                            '<div class="carousel-inner">' +
                                images.map(function (src, index) {
                                    var activeClass = index === 0 ? ' active' : '';
                                    var displayStyle = index === 0 ? 'block' : 'none';
                                    return '<img class="carousel-item' + activeClass + '" style="display:' + displayStyle + ';" src="../' + src + '" alt="' + (p.imageAlt && p.imageAlt.en ? p.imageAlt.en : '') + '">';
                                }).join('') +
                            '</div>' +
                            (images.length > 1
                                ? '<button class="carousel-btn prev" data-dir="prev">&#10094;</button>' +
                                  '<button class="carousel-btn next" data-dir="next">&#10095;</button>'
                                : '') +
                        '</div>' +
                        '<div class="produit-intro">' +
                            '<span class="ref">REF: ' + p.ref + '</span>' +
                            '<h2>' + (p.name && p.name.en ? p.name.en : '') + '</h2>' +
                            '<p>' + (p.description && p.description.en ? p.description.en : '') + '</p>' +
                            (p.step
                                ? '<button class="btn-3d" data-step="../' + p.step + '" data-name="' + (p.name && p.name.en ? p.name.en : '') + '">&#9654; 3D View</button>'
                                : '') +
                        '</div>' +
                    '</div>' +
                    '<table class="options-table">' +
                        '<thead>' +
                            '<tr><th>Version</th><th>Included</th><th>Price</th><th>Secure order</th></tr>' +
                        '</thead>' +
                        '<tbody>' +
                            (p.options || []).map(function (opt, idx) {
                                var optLabel = (opt.label && opt.label.en ? opt.label.en : '');
                                var optPrice = (opt.price || '');
                                return '<tr>' +
                                    '<td><strong>' + optLabel + '</strong></td>' +
                                    '<td>' + (opt.includes && opt.includes.en ? opt.includes.en : '') + '</td>' +
                                    '<td class="price-tag">' + optPrice + '</td>' +
                                    '<td>' +
                                        '<input type="number" min="1" value="1" class="qty-commande" style="width:55px;margin-right:8px;" ' +
                                            'data-ref="' + (p.ref || '') + '" ' +
                                            'data-name="' + (p.name && p.name.en ? p.name.en : '') + '" ' +
                                            'data-option="' + optLabel + '" ' +
                                            'data-price="' + optPrice + '"' +
                                        '>' +
                                        '<a href="#" class="btn-Commande" ' +
                                            'data-ref="' + (p.ref || '') + '" ' +
                                            'data-name="' + (p.name && p.name.en ? p.name.en : '') + '" ' +
                                            'data-option="' + optLabel + '" ' +
                                            'data-price="' + optPrice + '"' +
                                        '>Add to cart</a>' +
                                    '</td>' +
                                '</tr>';
                            }).join('') +
                        '</tbody>' +
                    '</table>';

                container.appendChild(card);
            });

            initCarousels();
            initCartButtons();
            init3DButtons();
        })
        .catch(function (err) {
            console.error('Error loading produits.json', err);
        });

    // ?? Lightbox: enlarged photos ????????????????????????????????????????????
    var lbEl = document.getElementById('lightbox');
    var lbImg = document.getElementById('lb-img');
    var lbPrev = document.getElementById('lb-prev');
    var lbNext = document.getElementById('lb-next');
    var lbClose = document.getElementById('lb-close');
    var lbCounter = document.getElementById('lb-counter');
    var lbList = [];
    var lbIdx = 0;

    function lbRender() {
        lbImg.src = lbList[lbIdx];
        var multi = lbList.length > 1;
        lbPrev.style.display = multi ? '' : 'none';
        lbNext.style.display = multi ? '' : 'none';
        lbCounter.style.display = multi ? '' : 'none';
        lbCounter.textContent = (lbIdx + 1) + ' / ' + lbList.length;
    }
    function openLightbox(images, start) {
        if (!images || !images.length) return;
        lbList = images;
        lbIdx = start || 0;
        lbRender();
        lbEl.classList.add('open');
        document.body.style.overflow = 'hidden';
    }
    function closeLightbox() {
        lbEl.classList.remove('open');
        document.body.style.overflow = '';
    }
    function lbStep(d) {
        lbIdx = (lbIdx + d + lbList.length) % lbList.length;
        lbRender();
    }
    if (lbEl) {
        lbPrev.addEventListener('click', function (e) { e.stopPropagation(); lbStep(-1); });
        lbNext.addEventListener('click', function (e) { e.stopPropagation(); lbStep(1); });
        lbClose.addEventListener('click', closeLightbox);
        lbEl.addEventListener('click', closeLightbox);  // click anywhere closes (except arrows: stopPropagation)
        document.addEventListener('keydown', function (e) {
            if (!lbEl.classList.contains('open')) return;
            if (e.key === 'Escape') closeLightbox();
            else if (e.key === 'ArrowLeft') lbStep(-1);
            else if (e.key === 'ArrowRight') lbStep(1);
        });
    }

    function initCarousels() {
        var carousels = document.querySelectorAll('.carousel');

        carousels.forEach(function (carousel) {
            var items = carousel.querySelectorAll('.carousel-item');
            if (!items.length) return;

            var index = 0;
            var inner = carousel.querySelector('.carousel-inner');
            var imgSrcs = Array.prototype.map.call(items, function (im) {
                return im.getAttribute('src');
            });
            if (inner) {
                inner.addEventListener('click', function () {
                    openLightbox(imgSrcs, index);
                });
            }

            function show(i) {
                index = (i + items.length) % items.length;
                items.forEach(function (img, k) {
                    var isActive = (k === index);
                    img.classList.toggle('active', isActive);
                    img.style.display = isActive ? 'block' : 'none';
                });
            }

            var prevBtn = carousel.querySelector('.carousel-btn.prev');
            var nextBtn = carousel.querySelector('.carousel-btn.next');

            if (prevBtn) {
                prevBtn.addEventListener('click', function (e) {
                    e.stopPropagation();
                    show(index - 1);
                    resetAutoPlay();
                });
            }

            if (nextBtn) {
                nextBtn.addEventListener('click', function (e) {
                    e.stopPropagation();
                    show(index + 1);
                    resetAutoPlay();
                });
            }

            var autoTimer;
            function resetAutoPlay() {
                clearInterval(autoTimer);
                if (items.length > 1) {
                    autoTimer = setInterval(function () { show(index + 1); }, 4000);
                }
            }
            resetAutoPlay();

            var startX = null;
            carousel.addEventListener('touchstart', function (e) {
                if (e.touches && e.touches.length === 1) {
                    startX = e.touches[0].clientX;
                }
            });

            carousel.addEventListener('touchend', function (e) {
                if (startX === null) return;
                var endX = e.changedTouches[0].clientX;
                var deltaX = endX - startX;
                var threshold = 30;
                if (deltaX > threshold) {
                    show(index - 1);
                } else if (deltaX < -threshold) {
                    show(index + 1);
                }
                startX = null;
            });
        });
    }

    // ?? 3D Viewer local (occt-import-js + online-3d-viewer) ??????????????????
    var ovViewer = null;

    function init3DButtons() {
        document.querySelectorAll('.btn-3d').forEach(function (btn) {
            btn.addEventListener('click', function () {
                open3DModal(btn.getAttribute('data-step'), btn.getAttribute('data-name') || '3D Model');
            });
        });
    }

    function open3DModal(stepPath, title) {
        var modal     = document.getElementById('modal3d');
        var container = document.getElementById('viewer-container');

        document.getElementById('modal3d-title').textContent = title + ' ? 3D View';
        modal.classList.add('open');
        container.innerHTML = '<div class="viewer-msg">Loading 3D model?</div>';

        var fileUrl = stepPath.match(/^https?:\/\//)
            ? stepPath
            : window.location.origin + window.location.pathname.replace(/\/[^/]*$/, '/') + stepPath;

        // Cache-busting: force browser/CDN to fetch the latest model after an update
        // (value set once per page load).
        if (!window.__modelVersion) { window.__modelVersion = Date.now(); }
        fileUrl += (fileUrl.indexOf('?') === -1 ? '?' : '&') + 'v=' + window.__modelVersion;

        var viewerDiv = document.createElement('div');
        viewerDiv.style.cssText = 'width:100%;height:100%;';
        container.innerHTML = '';
        container.appendChild(viewerDiv);

        if (ovViewer) { try { ovViewer.Destroy(); } catch(e) {} ovViewer = null; }

        try {
            ovViewer = new OV.EmbeddedViewer(viewerDiv, {
                onModelLoaded: brightenScene
            });
            ovViewer.LoadModelFromUrlList([fileUrl]);
        } catch (e) {
            container.innerHTML = '<div class="viewer-msg">Error loading 3D model.<br><small style="color:#666;">' + e.message + '</small></div>';
        }
    }

    // Brightens the model: the default ambient light is black,
    // which makes unlit faces look very dark ("in shadow").
    function brightenScene() {
        if (!ovViewer) return;
        try {
            var v = ovViewer.GetViewer();
            var sm = v.shadingModel;
            if (sm && sm.ambientLight && sm.directionalLight) {
                sm.ambientLight.color.setHex(0x999999);
                sm.directionalLight.color.setHex(0xaaaaaa);
                v.Render();
            }
        } catch (e) { /* viewer not ready: ignore */ }
    }

    function close3DModal() {
        document.getElementById('modal3d').classList.remove('open');
        document.getElementById('viewer-container').innerHTML = '';
        if (ovViewer) { try { ovViewer.Destroy(); } catch(e) {} ovViewer = null; }
    }

    document.getElementById('modal3d-close').addEventListener('click', close3DModal);
    document.getElementById('modal3d').addEventListener('click', function (e) {
        if (e.target === this) close3DModal();
    });

    // Simple cart using localStorage (same key as FR)
    function initCartButtons() {
        var buttons = document.querySelectorAll('.btn-Commande[data-ref]');
        buttons.forEach(function (btn) {
            btn.addEventListener('click', function (e) {
                e.preventDefault();
                var parentCell = btn.closest('td');
                var qtyInput = parentCell ? parentCell.querySelector('.qty-commande') : null;
                var qtyVal = qtyInput ? parseInt(qtyInput.value, 10) : 1;
                if (isNaN(qtyVal) || qtyVal < 1) qtyVal = 1;

                var item = {
                    ref: btn.getAttribute('data-ref') || '',
                    name: btn.getAttribute('data-name') || '',
                    option: btn.getAttribute('data-option') || '',
                    price: btn.getAttribute('data-price') || '',
                    qty: qtyVal
                };

                try {
                    var stored = localStorage.getItem('panierInovaFlux');
                    var cart = stored ? JSON.parse(stored) : [];

                    var merged = false;
                    for (var i = 0; i < cart.length; i++) {
                        var it = cart[i];
                        if (it.ref === item.ref &&
                            it.option === item.option &&
                            it.price === item.price) {
                            it.qty = (it.qty || 1) + item.qty;
                            merged = true;
                            break;
                        }
                    }
                    if (!merged) {
                        cart.push(item);
                    }

                    localStorage.setItem('panierInovaFlux', JSON.stringify(cart));
                    alert('Added to cart: ' + item.qty + ' x ' + item.name + ' - ' + item.option);
                } catch (err) {
                    console.error('Cart error', err);
                    alert('Unable to add to cart in this browser.');
                }
            });
        });
    }
</script>

</body>
</html>
